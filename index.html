<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The igent.me contract, version 0</title>
<meta name="description" content="The seam between an igent and its portal: one WebTransport connection, a heartbeat datagram, a control stream, an agent stream, three topics, and a verdict on every call. Rendered from contract.md beside this page.">
<style>
  :root { --bg: #0d1117; --panel: #161b22; --border: #30363d; --fg: #e6edf3; --dim: #8b949e; --accent: #58a6ff; --permit: #3fb950; --deny: #f85149; }
  @media (prefers-color-scheme: light) { :root { --bg: #f6f8fa; --panel: #ffffff; --border: #d0d7de; --fg: #1f2328; --dim: #656d76; --accent: #0969da; --permit: #1a7f37; --deny: #cf222e; } }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .wrap { max-width: 900px; margin: 0 auto; padding: 24px 16px 64px; }
  h1 { font-size: 26px; margin: 0 0 12px; }
  h2 { font-size: 19px; margin: 34px 0 10px; border-bottom: 1px solid var(--border); padding-bottom: 6px; }
  h3 { font-size: 16px; margin: 22px 0 8px; }
  a { color: var(--accent); text-decoration: none; } a:hover { text-decoration: underline; }
  code, pre { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; }
  code { background: var(--panel); border: 1px solid var(--border); border-radius: 4px; padding: 0 4px; }
  pre { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 12px; overflow-x: auto; }
  pre code { border: 0; padding: 0; background: none; }
  .scroll { overflow-x: auto; }
  table { border-collapse: collapse; width: 100%; font-size: 14px; }
  th, td { text-align: left; vertical-align: top; padding: 6px 8px; border-bottom: 1px solid var(--border); }
  th { color: var(--dim); font-weight: 600; }
  .status { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 10px 14px; font-size: 14px; margin-bottom: 18px; }
  .ok { color: var(--permit); } .bad { color: var(--deny); } .dim { color: var(--dim); }
  #error { color: var(--deny); white-space: pre-wrap; }
</style>
</head>
<body>
<div class="wrap">
  <div class="status" id="status">rendering <code>contract.md</code>…</div>
  <div id="error" hidden></div>
  <article id="doc"></article>
</div>
<script type="module">
const $ = (id) => document.getElementById(id);
const esc = (s) => s.replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const inline = (s) => esc(s)
  .replace(/`([^`]+)`/g, (_, c) => `<code>${c}</code>`)
  .replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>")
  .replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');

// A small Markdown renderer: headings, paragraphs, tables, fenced code, lists, inline code, bold, links.
function render(md) {
  const lines = md.split("\n");
  let out = "", i = 0;
  while (i < lines.length) {
    const l = lines[i];
    if (l.startsWith("```")) {
      let j = i + 1, buf = [];
      while (j < lines.length && !lines[j].startsWith("```")) buf.push(lines[j++]);
      out += `<pre><code>${esc(buf.join("\n"))}</code></pre>`; i = j + 1; continue;
    }
    const h = l.match(/^(#{1,3}) (.*)/);
    if (h) { out += `<h${h[1].length}>${inline(h[2])}</h${h[1].length}>`; i++; continue; }
    if (l.startsWith("|")) {
      const rows = [];
      while (i < lines.length && lines[i].startsWith("|")) rows.push(lines[i++]);
      const cells = (r) => r.replace(/^\||\|$/g, "").split("|").map((c) => c.trim());
      const head = cells(rows[0]);
      const body = rows.slice(rows[1] && /^\|?\s*-/.test(rows[1]) ? 2 : 1);
      out += `<div class="scroll"><table><tr>${head.map((c) => `<th>${inline(c)}</th>`).join("")}</tr>` +
        body.map((r) => `<tr>${cells(r).map((c) => `<td>${inline(c)}</td>`).join("")}</tr>`).join("") + `</table></div>`;
      continue;
    }
    if (l.startsWith("- ")) {
      const items = [];
      while (i < lines.length && lines[i].startsWith("- ")) items.push(lines[i++].slice(2));
      out += `<ul>${items.map((t) => `<li>${inline(t)}</li>`).join("")}</ul>`; continue;
    }
    if (l.trim() === "") { i++; continue; }
    const para = [];
    while (i < lines.length && lines[i].trim() !== "" && !/^(#{1,3} |\||- |```)/.test(lines[i])) para.push(lines[i++]);
    out += `<p>${inline(para.join(" "))}</p>`;
  }
  return out;
}

async function sha256(buf) {
  const d = await crypto.subtle.digest("SHA-256", buf);
  return [...new Uint8Array(d)].map((b) => b.toString(16).padStart(2, "0")).join("");
}

try {
  const md = await (await fetch("contract.md", { cache: "no-store" })).text();
  $("doc").innerHTML = render(md);
  const own = await sha256(new TextEncoder().encode(md));
  const cited = md.match(/sha256 `([0-9a-f]{64})`/)?.[1];
  const hb = await (await fetch("examples/heartbeat.json", { cache: "no-store" })).json();
  const wire = new TextEncoder().encode(JSON.stringify(hb)).length;
  let specLine = `<span class="dim">§9 cites the status-line spec ${cited ? cited.slice(0, 16) : "(no hash found)"}; the identities item is not reachable from this copy</span>`;
  try {
    const spec = await (await fetch("../identities/status-line.md", { cache: "no-store" })).arrayBuffer();
    const actual = await sha256(spec);
    specLine = actual === cited
      ? `<span class="ok">§9's hash equals the served identities spec</span> <code>${actual.slice(0, 16)}</code>`
      : `<span class="bad">§9's hash differs from the served identities spec</span> cited <code>${String(cited).slice(0, 16)}</code>, served <code>${actual.slice(0, 16)}</code>`;
  } catch {}
  $("status").innerHTML = `<b>contract.md</b> sha256 <code>${own.slice(0, 16)}</code> · rendered here, unchanged · ` +
    `heartbeat fixture <span class="${wire <= 200 ? "ok" : "bad"}">${wire} B of 200</span> · ${specLine} · ` +
    `<a href="contract.md">the Markdown</a> · <a href="examples/heartbeat.json">examples/</a> · run <code>node bin/check.mjs</code> for the 54 rules`;
} catch (e) {
  $("error").hidden = false; $("error").textContent = `could not render: ${e.message}`;
}
</script>
</body>
</html>
